<main class="profile-page container py-4 py-md-5">
  <section class="profile-card card border-0 shadow-sm mx-auto">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-4">Mi perfil</h1>

      <label class="form-label" for="profile-image">Foto de perfil</label>
      <input
        id="profile-image"
        class="form-control"
        type="file"
        accept="image/*"
        (change)="subir($event)"
      />

      @if (url()) {
        <div class="profile-preview mt-4">
          <img class="img-thumbnail" [src]="url()" alt="Foto de perfil" />
        </div>
      }
    </div>
  </section>
</main>
