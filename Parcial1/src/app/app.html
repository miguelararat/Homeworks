<h1>Sistema de gestión de turnos</h1>

<input [(ngModel)]="nombrePaciente" placeholder="Ingrese el nombre del nuevo paciente">
<p></p>
<button type="submit" (click)="agregarPaciente(nombrePaciente); nombrePaciente = ''">Agregar paciente</button>

<app-patient-queue [patient]="verPacienteActual()" (atender)="atenderPaciente($event)"></app-patient-queue>
<app-patient-historial [historial]="obtenerHistorialComoArreglo()"></app-patient-historial>
<app-administrative-commitee [administrador]="administradorActual()" (avanzar)="avanzarComite()" (retroceder)="retrocederComite()"></app-administrative-commitee>
<app-doctor-rotation [medico] = "medicoActual()" (nextDoctor)="avanzarTurno()"></app-doctor-rotation>
