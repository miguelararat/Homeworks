<div class="login" >
  <h1>Iniciar sesión</h1>

  <form (ngSubmit)="entrar()">
    <input class = "form-control"name="email" type="email" [(ngModel)]="email" placeholder="Email" required>
    <input class = "form-control"name="password" type="password" [(ngModel)]="password" placeholder="Contraseña" required>
    <button type="submit" class="btn btn-primary">Entrar</button>
  </form>

  @if (auth.error()) {
    <p class="error">{{auth.error()}}</p>
  }

   <p>¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
</div>
