@if (nodo) {
  <li class = "menu-item">
    <span class ="menu-item__titulo">{{ nodo.titulo }}</span>

    @if (nodo.hijos.length > 0) {
      <ul class="menu-item__submenu">
        @for (hijo of nodo.hijos; track hijo.titulo) {
          <app-menu-item [nodo]="hijo"></app-menu-item>
        }
      </ul>
    }
  </li>
}
